<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Besh Vaqt — prayer tracker</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%230E7C7B' d='M16 2l3.5 8.5L28 7l-3.5 9L33 16l-8.5 3.5L28 25l-8.5-3.5L16 30l-3.5-8.5L4 25l3.5-9L-1 16l8.5-3.5L4 7l8.5 3.5z'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="app-header">
  <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
    <path d="M16 3l3 7.4L26.4 7 23 14.4 30 16l-7 1.6 3.4 7.4-7.4-3.4L16 29l-3-7.4L5.6 25 9 17.6 2 16l7-1.6L5.6 7l7.4 3.4z"/>
  </svg>
  <h1>Besh Vaqt</h1>
</header>

<main id="main">
  <section id="view-day" class="view" hidden>
    <div class="day-nav">
      <button class="icon-btn" id="day-prev" aria-label="Previous day">&#8249;</button>
      <div class="day-title">
        <h2 id="day-date"></h2>
        <button id="day-today" class="chip" hidden>Back to today</button>
      </div>
      <button class="icon-btn" id="day-next" aria-label="Next day">&#8250;</button>
    </div>
    <ul id="prayer-list" class="prayer-list"></ul>
    <p id="day-error" class="error" hidden></p>
  </section>

  <section id="view-calendar" class="view" hidden>
    <div class="day-nav">
      <button class="icon-btn" id="cal-prev" aria-label="Previous month">&#8249;</button>
      <h2 id="cal-title"></h2>
      <button class="icon-btn" id="cal-next" aria-label="Next month">&#8250;</button>
    </div>
    <div class="cal-weekdays" id="cal-weekdays"></div>
    <div class="cal-grid" id="cal-grid"></div>
    <p class="cal-hint">Tap a day to edit its prayers — past or future.</p>
    <p id="cal-error" class="error" hidden></p>
  </section>

  <section id="view-stats" class="view" hidden>
    <div id="stats-body"></div>
    <p id="stats-error" class="error" hidden></p>
  </section>

  <section id="view-settings" class="view" hidden>
    <h2 class="section-title">Settings</h2>
    <form id="settings-form">
      <fieldset>
        <legend>Location</legend>
        <div class="field-row">
          <label>Latitude <input type="number" name="latitude" step="any" min="-90" max="90" required></label>
          <label>Longitude <input type="number" name="longitude" step="any" min="-180" max="180" required></label>
        </div>
        <button type="button" id="geo-btn" class="chip">Use my location</button>
        <label>Timezone <select name="timezone"></select></label>
      </fieldset>
      <fieldset>
        <legend>Calculation</legend>
        <label>Method <select name="method"></select></label>
        <label>Asr madhab <select name="madhab"></select></label>
      </fieldset>
      <fieldset>
        <legend>Qaza tracking</legend>
        <label>Count missed prayers from
          <input type="date" name="trackingStartDate" required>
        </label>
      </fieldset>
      <button type="submit" class="primary">Save changes</button>
      <p id="settings-status" role="status"></p>
    </form>
  </section>
</main>

<nav class="tab-bar" aria-label="Views">
  <button data-tab="day" aria-current="true">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4a6 6 0 0 1 6 6v9H6v-9a6 6 0 0 1 6-6z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 19h18" stroke="currentColor" stroke-width="2"/></svg>
    Today</button>
  <button data-tab="calendar">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="6" width="16" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M4 10h16M8 4v4M16 4v4" stroke="currentColor" stroke-width="2"/></svg>
    Calendar</button>
  <button data-tab="stats">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V12M12 20V6M19 20v-5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    Stats</button>
  <button data-tab="settings">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1" stroke="currentColor" stroke-width="2"/></svg>
    Settings</button>
</nav>

<script src="app.js"></script>
</body>
</html>
